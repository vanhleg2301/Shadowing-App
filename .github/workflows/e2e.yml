# Smoke tests (e2e/, Playwright) against the live site after each successful Vercel production deploy,
# or by hand from the Actions tab against any URL. Signed-out pages only; no secrets needed.
name: E2E smoke tests

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Site to test"
        required: false
        default: "https://shadowing-app-liard.vercel.app"

permissions:
  contents: read

concurrency:
  group: e2e
  cancel-in-progress: true

jobs:
  smoke:
    # Vercel reports every deploy; only finished production ones are tested (previews need a Vercel login).
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run tests
        run: npx playwright test
        env:
          BASE_URL: ${{ inputs.base_url || 'https://shadowing-app-liard.vercel.app' }}
      - name: Upload report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
