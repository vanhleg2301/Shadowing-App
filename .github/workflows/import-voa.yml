# Imports VOA Learning English lessons into Supabase (scripts/voa/import_voa.py). Run it by hand from the
# Actions tab. Needs repository secrets NEXT_PUBLIC_SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY, and migration 010.
name: Import VOA lessons

on:
  workflow_dispatch:
    inputs:
      programs:
        description: "Programs (comma-separated): lets-learn-english-1, lets-learn-english-2, everyday-grammar, health-lifestyle, words-and-their-stories. Empty = all"
        required: false
        default: ""
      limit:
        description: "New lessons in this run"
        required: false
        default: "20"
      urls:
        description: "Optional: VOA article or section URLs (space-separated), instead of the programs"
        required: false
        default: ""
      dry_run:
        description: "Dry run (parse and align, write nothing)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: import-voa
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/voa/requirements.txt
      # The first run spent 30+ minutes here; skipping recommended packages and the man-db rebuild keeps it short.
      - name: Install ffmpeg
        run: |
          command -v ffmpeg && exit 0
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r scripts/voa/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small.en
      - name: Import
        run: python scripts/voa/import_voa.py
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROGRAMS: ${{ inputs.programs }}
          LIMIT: ${{ inputs.limit }}
          URLS: ${{ inputs.urls }}
          DRY_RUN: ${{ inputs.dry_run }}
          DUMP_DIR: ${{ inputs.dry_run && format('{0}/voa-pages', runner.temp) || '' }}
      - name: Upload fetched pages (dry run)
        if: ${{ always() && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: voa-pages
          path: ${{ runner.temp }}/voa-pages
          if-no-files-found: ignore
          retention-days: 7
